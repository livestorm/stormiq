# Render deployment for StormIQ.
#
# Three services, one Postgres add-on:
#   - web    : FastAPI + built Vue frontend (Dockerfile at repo root)
#   - worker : arq worker (docker/Dockerfile.worker)
#   - redis  : managed Redis instance (Render Key Value)
#
# REDIS_URL is wired from the redis service into both web and worker via
# fromService. DATABASE_URL must be set in the dashboard (link to the
# Postgres add-on). All other env vars (OPENAI_API_KEY, ELEVENLABS_API_KEY, GLADIA_KEY,
# Livestorm OAuth, etc.) are set per-service in the dashboard — see
# docs/operations.md.

services:
  - type: web
    name: stormiq
    runtime: docker
    plan: starter
    autoDeploy: true
    # Render waits for this to return 200 before routing traffic to a new deploy.
    healthCheckPath: /api/health
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: stormiq-redis
          property: connectionString

  - type: worker
    name: stormiq-worker
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.worker
    plan: starter
    autoDeploy: true
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: stormiq-redis
          property: connectionString

  - type: keyvalue
    name: stormiq-redis
    plan: free
    ipAllowList: []
