<!doctype html>
<html lang="en" data-ui="v1">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>StormIQ</title>
    <script>
      // Before first paint: a saved theme choice, so the page doesn't flash
      // the wrong colours. Mirrors src/design/theme.js (same key).
      (function () {
        var root = document.documentElement;
        var storage = null;
        try { storage = window.localStorage; } catch (e) { storage = null; }
        try {
          var theme = storage && storage.getItem("stormiq:theme");
          if (theme === "light" || theme === "dark") root.setAttribute("data-theme", theme);
        } catch (e) {
          // No saved choice: follow the system.
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
