name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stormiq
          POSTGRES_PASSWORD: stormiq
          POSTGRES_DB: stormiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stormiq -d stormiq"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # Enables the real-database tests (tests/test_db_scope.py).
      TEST_DATABASE_URL: postgresql://stormiq:stormiq@localhost:5432/stormiq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  frontend:
    name: Frontend (eslint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t stormiq-web .
      - run: docker build -f docker/Dockerfile.worker -t stormiq-worker .
